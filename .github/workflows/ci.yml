name: CI

on:
  # Branch pushes only build `main`. A push to a feature branch that has an open
  # pull request used to start a second, identical run of the same commit; both
  # wrote check runs to that head, so a failure in either one could block the
  # pull request even when its own run was green. `pull_request` still covers
  # every branch that is up for review, and `main` keeps a post-merge signal.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Pinned: the floating "24" advanced to 24.17.0, which ships an undici
          # regression that asserts (`!this.paused`) when a server closes a socket
          # at the end of a response — every fetch-based suite (e.g. test:dashboard)
          # then crashes on teardown with exit 1. 24.14.1 is verified green on the
          # full suite. Revisit when a newer 24.x fixes the undici teardown assert.
          node-version: "24.14.1"
          cache: npm

      - name: Install
        run: npm ci

      - name: Existing test suites
        run: npm test

      - name: Reviewer kit
        run: npm run reviewer-kit

      - name: Whitespace
        run: npm run check:whitespace

      - name: Replay verification
        run: npm run test:replay

      - name: Conformance freeze
        run: npm run test:conformance

  # Package & release-truth contract. Kept in a separate job (not folded into the
  # default suite) so it can pack, install into a clean project, boot, and
  # uninstall without inflating every other suite's cost. Requires no secrets.
  release-contract:
    name: Release contract
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Install
        run: npm ci

      - name: Release identity (version drift)
        run: npm run test:release-identity

      - name: Release build + checksums
        run: npm run release

      - name: Release truth (pack, install, run outside repo, fail-closed, uninstall)
        run: npm run release:verify
