name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Pinned: the floating "24" advanced to 24.17.0, which ships an undici
          # regression that asserts (`!this.paused`) when a server closes a socket
          # at the end of a response — every fetch-based suite (e.g. test:dashboard)
          # then crashes on teardown with exit 1. 24.14.1 is verified green on the
          # full suite. Revisit when a newer 24.x fixes the undici teardown assert.
          node-version: "24.14.1"
          cache: npm

      - name: Install
        run: npm ci

      - name: Existing test suites
        run: npm test

      - name: Reviewer kit
        run: npm run reviewer-kit

      - name: Whitespace
        run: npm run check:whitespace

      - name: Replay verification
        run: npm run test:replay

      - name: Conformance freeze
        run: npm run test:conformance

  # Package & release-truth contract. Kept in a separate job (not folded into the
  # default suite) so it can pack, install into a clean project, boot, and
  # uninstall without inflating every other suite's cost. Requires no secrets.
  release-contract:
    name: Release contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Install
        run: npm ci

      - name: Release identity (version drift)
        run: npm run test:release-identity

      - name: Release build + checksums
        run: npm run release

      - name: Upload Linux pilot artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mnde-pilot-${{ github.sha }}-linux
          path: release/*
          if-no-files-found: error
          retention-days: 90

      - name: Release truth (pack, install, run outside repo, fail-closed, uninstall)
        run: npm run release:verify
